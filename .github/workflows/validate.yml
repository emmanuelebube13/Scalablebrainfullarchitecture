name: Validate content layer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install — the validator is a single zero-dep ES module.
      - name: Validate data/ against schema/
        run: node tools/validate.mjs
