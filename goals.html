<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goals, milestones & tasks — Scalable Brain</title>
<meta name="description" content="Milestone ladder, macro goals, cross-system dependency matrix and per-subsystem task tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/goals.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>

<main id="main" class="goals-main">

  <!-- ── Compact hero ─────────────────────────────────────────── -->
  <div class="goals-hero">
    <div class="goals-hero-inner">
      <div class="goals-hero-text">
        <span class="kicker" id="goals-asof">Loading…</span>
        <h1>Goals &amp; tasks</h1>
        <p class="goals-lede">Which rung of the ladder does this move? Work that moves no rung is a cost.</p>
      </div>
      <!-- Ladder pills — always visible at the top -->
      <div class="goals-ladder-strip" id="ladder-strip"></div>
    </div>
  </div>

  <!-- ── Tab bar ───────────────────────────────────────────────── -->
  <div class="goals-tabbar-wrap">
    <div class="goals-tabbar" role="tablist" aria-label="Goals sections">
      <button role="tab" aria-selected="true"  data-panel="panel-goals"    class="gtab active">Goals</button>
      <button role="tab" aria-selected="false" data-panel="panel-ladder"   class="gtab">Ladder</button>
      <button role="tab" aria-selected="false" data-panel="panel-matrix"   class="gtab">Dependencies</button>
      <button role="tab" aria-selected="false" data-panel="panel-tasks"    class="gtab">Tasks</button>
    </div>
    <!-- filters live here, contextual per tab -->
    <div class="goals-tab-filters" id="tab-filters"></div>
  </div>

  <!-- ── Panels ───────────────────────────────────────────────── -->
  <div class="goals-panels">
    <div id="panel-goals"  class="goals-panel active" role="tabpanel"><div class="goals-panel-scroll" id="goals"></div></div>
    <div id="panel-ladder" class="goals-panel"        role="tabpanel"><div class="goals-panel-scroll" id="milestones"></div></div>
    <div id="panel-matrix" class="goals-panel"        role="tabpanel"><div class="goals-panel-scroll" id="matrix"></div></div>
    <div id="panel-tasks"  class="goals-panel"        role="tabpanel"><div class="goals-panel-scroll" id="tasks"></div></div>
  </div>

</main>

<footer id="site-footer"></footer>
<script type="module" src="assets/js/goals.js"></script>
</body>
</html>
