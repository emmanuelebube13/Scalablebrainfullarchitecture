<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Runbook — Scalable Brain</title>
<meta name="description" content="Master runbook for the Scalable Brain architecture.">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  .runbook-content {
    max-width: 900px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .runbook-content h1, .runbook-content h2, .runbook-content h3 {
    margin-top: 1.5em;
    color: var(--text);
  }
  .runbook-content h1 {
    font-size: 2.2rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3em;
  }
  .runbook-content h2 {
    font-size: 1.7rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.3em;
  }
  .runbook-content h3 {
    font-size: 1.3rem;
  }
  .runbook-content pre {
    padding: 1.2em;
    background: var(--bg-card);
    overflow-x: auto;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin: 1.5em 0;
  }
  .runbook-content code {
    background: var(--bg-card);
    padding: 0.2em 0.4em;
    border-radius: 3px;
    font-family: var(--font-mono, monospace);
    font-size: 0.9em;
  }
  .runbook-content pre code {
    padding: 0;
    background: transparent;
  }
  .runbook-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
  }
  .runbook-content th, .runbook-content td {
    border: 1px solid var(--border);
    padding: 0.75em;
    text-align: left;
  }
  .runbook-content th {
    background-color: var(--bg-card);
    font-weight: 600;
  }
  .runbook-content blockquote {
    border-left: 4px solid var(--brand);
    margin: 1.5em 0;
    padding-left: 1em;
    color: var(--text-faint);
  }
  .runbook-content a {
    color: var(--brand);
    text-decoration: none;
  }
  .runbook-content a:hover {
    text-decoration: underline;
  }
  .runbook-content ul, .runbook-content ol {
    margin: 1em 0;
    padding-left: 2em;
  }
  .runbook-content li {
    margin-bottom: 0.5em;
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>

<main id="main">
  <section class="hero">
    <div class="wrap">
      <div class="eyebrow">Operations</div>
      <h1>Master Runbook</h1>
      <p class="lede">Comprehensive operational procedures, maintenance scripts, and troubleshooting guides.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap runbook-content" id="content">
      Loading runbook...
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script type="module" src="assets/js/runbook.js"></script>
</body>
</html>
